name: Cato compatibility audit

# Runs the compatibility harness that lives in br-collab/aureon
# (parity/run_parity.py): this repository's gate_core.js — the exact decision
# core index.js executes — against the in-process Python twin
# (aureon/mcp/cato_client.py), on the golden vectors. Mirrored by
# .github/workflows/parity.yml in aureon, which runs the same harness from the
# other side.
#
# aureon is checked out at `main` by default, not pinned: the question this
# job answers is whether the two repositories as they stand agree. The daily
# run catches a twin change landing on the aureon side with no Cato push.
# This is not a compatibility certification: declared known-failing vectors and
# production-input differences keep COMPATIBILITY_STATUS.json INCOMPATIBLE.
# Exit code 0 means no undeclared drift; 1 means unexpected drift; 2 means not
# assessed. All non-zero codes fail the job.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      aureon_ref:
        description: "aureon ref to compare against (branch, tag or SHA)"
        default: main

permissions:
  contents: read

jobs:
  # Keep this identifier stable: branch protection requires the `parity` check.
  # The workflow and step names explain that the check is an audit, not certification.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the harness and Python twin (aureon)
        uses: actions/checkout@v7
        with:
          repository: br-collab/aureon
          ref: ${{ inputs.aureon_ref || 'main' }}
          path: aureon

      - name: Check out this repository where the harness expects it
        uses: actions/checkout@v7
        with:
          path: aureon/cato-mcp

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run declared compatibility audit
        run: python aureon/parity/run_parity.py
